# HorizontalPodAutoscaler: automatically adjusts replica count based on
# real CPU load, instead of the fixed "3" hardcoded in the Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resnet18-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resnet18-deployment   # must match the Deployment name
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # add more replicas if avg CPU exceeds 70%

# Deployment: a standing rule, not a one-time command. This says "keep 3
# copies of the ResNet classification service running, always" - if a Pod
# crashes, Kubernetes notices and replaces it without anyone paging a human.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resnet18-deployment
  labels:
    app: resnet18
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resnet18
  template:
    metadata:
      labels:
        app: resnet18   # this label is how the Service below finds these Pods
    spec:
      containers:
        - name: resnet18-container
          # same image already pushed to Artifact Registry during the Cloud Run deployment
          image: europe-west3-docker.pkg.dev/YOUR_PROJECT_ID/mlops-repo/resnet18-service
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"      # 250 millicpu = a quarter of one CPU core
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            # Kubernetes hits this repeatedly - if it fails enough times in
            # a row, the Pod is considered broken and gets killed/restarted
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
